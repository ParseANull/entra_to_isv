[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "entra-to-isv"
version = "0.1.0"
description = "CLI and container to sync Azure AD (Entra ID) users to IBM Security Verify via SCIM"
authors = [{ name = "Your Team" }]
requires-python = ">=3.12"
dependencies = [
  "typer>=0.12.3",
  "httpx>=0.27.2",
  "msal>=1.29.0",
  "PyYAML>=6.0.1",
  "python-dotenv>=1.0.1",
]
readme = "README.md"

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
entra-sync = "entra_to_isv.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/entra_to_isv"]
